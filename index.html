<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
</head>
<body>
  <style>
    body {
        background-color:rgb(188, 118, 72);
    }

    #library {
        display: grid;
        grid-template-columns: repeat(3, 200px);
        justify-self: center;
        justify-content: center;
        gap: 30px;
    }

    .book {
        width: 200px;
        background-color: rgb(244, 217, 189);
        display: flex;
        flex-direction: column;
        align-items: center;
        border: 1px solid black;
        justify-self: center;
        border-radius: 15px;
    }
  </style>
  
  <button command="show-modal" commandfor="my-dialog">New Book</button>

  <dialog id="my-dialog">
    <form id="book-form">
      <div>
        <label for="title">Title: </label>
        <input type="text" id="title" name="title" required/>
      </div>
      <div>
        <label for="author">Author: </label>
        <input type="text" id="author" name="author" required/>
      </div>
      <div>
        <label for="pages">Pages: </label>
        <input type="number" id="pages" name="pages" required/>
      </div>
      <div>
        <label for="read">Read? </label>
        <input type="checkbox" id="read" name="read"/>
      </div>

      <div>
        <button type="submit">Add</button>
        <button>Cancel</button>
      </div>
      
    </form>
    
  </dialog>

  <div id="library"></div>

  <script>
    const library = document.querySelector("#library");

    function Book(title, author, pages, read) {
        if (!new.target) {
            throw Error("You must use the 'new' operator to call the constructor");
        }
        this.title = title;
        this.author = author;
        this.pages = pages;
        this.read = read;

        this.id = crypto.randomUUID();
    }

    const myLibrary = [];

    function addBookToLibrary(title, author, pages, read) {
        let newBook = new Book(title, author, pages, read);
        myLibrary.push(newBook);
    }

    function displayBooks() {
        library.replaceChildren();

        for(const book of myLibrary) {
            const newBook = document.createElement("div");
            newBook.classList.add("book");

            const title = document.createElement("p");
            title.textContent = `Title: ${book.title}`;
            newBook.appendChild(title);

            const author = document.createElement("p");
            author.textContent = `Author: ${book.author}`;
            newBook.appendChild(author);

            const pages = document.createElement("p");
            pages.textContent = `Pages: ${book.pages}`;
            newBook.appendChild(pages);

            const read = document.createElement("p");
            read.textContent = `Read: ${book.read ? "Completed" : "Not completed"}`;
            newBook.appendChild(read);

            library.appendChild(newBook);
        }
    }

    addBookToLibrary("Honey Bees", "great person", 75, false);
    addBookToLibrary("Cookies", "great chef", 300, true);
    addBookToLibrary("The Journey Home", "Radhanath Swami", 350, true);
    displayBooks();

    const dialog = document.querySelector("#my-dialog");
    const form = dialog.querySelector("#book-form");

    form.addEventListener("submit", event => {
        event.preventDefault();
        const titleInput = form.querySelector("#title");
        const authorInput = form.querySelector("#author");
        const pagesInput = form.querySelector("#pages");
        const readInput = form.querySelector("#read");

        addBookToLibrary(titleInput.value, authorInput.value, Number(pagesInput.value), readInput.checked ? true : false);
        displayBooks();
        dialog.close();
    });

  </script>
</body>
</html>
